	<body onload="initialize();">
		<header>
			<!-- TITLE AND SPONSORS -->

				<div class="grid-x align-middle show-for-medium">

						<img src="image2/bdt.jpg" class="sponsor-logo">
					</div>
					<div class="cell medium-6 large-8 text-center">
						<h1 data-js-fill-id="map_title" class="medium-h1"></h1>
					</div>
					<div class="cell medium-3 large-2 text-center">
						<img src="image2/rb.jpg" class="sponsor-logo">
					</div>
				</div>

				<div class="grid-x align-middle show-for-small-only">
					<div class="cell text-center">
						<h1 data-js-fill-id="map_title"></h1>
					</div>

						<img src="image2/bdt_small.jpg" class="sponsor-logo">
					</div>
					<div class="cell small-6 text-center">
						<img src="image2/rb.jpg" class="sponsor-logo">
					</div>
				</div>
			</section>

			<!-- FILTERS -->
			 <section class="filters">
				<div class="grid-x">
					<div class="cell large-4 text-center">
						<div class="grid-x">
							<div class="cell">
								Porte un dispositif dédié aux
							</div>
						</div>
						<div id="select-list" class="grid-x">
						</div>
					</div>
					<div class="cell large-4 text-center">
						<div class="grid-x">
							<div class="cell">
								Typologie d'acteurs
							</div>
						</div>
						<div id="select-list2" class="grid-x">
						</div>
					</div>
					<div class="cell large-2">
						<div class="grid-x">
							<div class="cell">
								Délimitation des EPCI Bretons
							</div>
							<div class="cell">
								<i class="fa-regular fa-window-minimize"></i>
							</div>
						</div>
					</div>
					<div class="cell large-2 text-center">
						<div class="input-group">
							<input class="input-group-field" type="text" placeholder="Rechercher">
							<div class="input-group-button">
								<button type="submit" class="button" >
									<i class="fa-solid fa-magnifying-glass"></i>
								</button>
							</div>
						</div>
					</div>
				</div>
			 </section>
		</header>

		<div class="off-canvas-wrap offcanvas-overlap" data-offcanvas style="width: 100%; z-index:1;"> 
			<nav class="tab-bar">
				<section class="left-small" id="menu_gauche"> <!-- bouton menu gauche -->
					<a class="left-off-canvas-toggle filter-link">
						<span class="hide-for-small-only">
							<img id="toggleButton" class="filter-image" src="image2//btn_filter_white.png">
						</span>
						<img class="show-for-small-only filter-image" src="image2/btn_filter_white.png">
					</a>
				</section>
				<h1 id="map_title"><!-- ### custom-script var filled ### --></h1>
			</nav>

			<ol id="joyride_tour" style="z-index:90;" class="joyride-list" data-joyride>

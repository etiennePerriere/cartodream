<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="content-type" content="text/html; charset=utf-8" />
        <title>Carte interactive</title>
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

        <!--[if lte IE 8]>
            <script>alert("Your web browser does not work well with this application. Please upgrade it or choose another browser.");</script>
        <![endif]-->
        
        <!-- Foundation -->
        <link rel="stylesheet" href="css/foundation.min.css">
        
        <!-- Font Awesome -->
        <link rel="stylesheet" href="css/fontawesome/css/fontawesome.min.css">
        <link rel="stylesheet" href="css/fontawesome/css/brands.min.css" />
        <link rel="stylesheet" href="css/fontawesome/css/solid.min.css" />
        <link rel="stylesheet" href="css/fontawesome/css/regular.min.css" />

        <!-- Leaflet and plugins -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.6.0/dist/leaflet.css" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw-src.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-easybutton@2/src/easy-button.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/naomap/leaflet-fusesearch@1e356c69b2b77e76b8931ded3efe27992ea47a0c/src/leaflet.fusesearch.css">
        
        <!-- Custom CSS -->
         <link rel="stylesheet" href="css/main.css">
        
        <!-- Leaflet Scripts -->
        <script src="https://unpkg.com/leaflet@1.6.0/dist/leaflet-src.js"></script>
        <script src="script/leaflet.markercluster-src.js"></script>
        <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw-src.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/leaflet-easybutton@2/src/easy-button.js"></script>
        
        <!-- Search functionality -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/1.2.2/fuse.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/naomap/leaflet-fusesearch@1e356c69b2b77e76b8931ded3efe27992ea47a0c/src/leaflet.fusesearch.js"></script>

        <!-- Initialize app -->
        <script type="text/javascript" src="js/config/site-config.js"></script>
        <script type="text/javascript" src="js/config/map-config.js"></script>
        <script type="text/javascript" src="js/components/map.js"></script>
        <script type="text/javascript" src="js/components/popups.js"></script>
        <script type="text/javascript" src="js/components/filters.js"></script>
        <script type="text/javascript" src="js/components/search.js"></script>
        <script type="text/javascript" src="js/components/ui.js"></script>
        <script type="text/javascript" src="js/main.js"></script>

        <!-- Data Files -->
        <script type="text/javascript" src="data/fond.js"></script>
        <script type="text/javascript" src="data/POI.js"></script>
        

    </head>

    <body onload="initialize();">

        <!-- Top panels container -->
        <div class="top-panels-container">
            <div class="grid-container fluid">
                <div class="grid-x grid-margin-x">
                    <!-- Left Column for main panels -->
                    <div class="cell shrink">
                        <!-- Logo & Search Panel -->
                        <div class="panel logo-search-panel">
                            <!-- Regular state -->
                            <div class="grid-x align-middle grid-padding-x" data-panel="regular-search">
                                <div class="cell shrink">
                                    <img src="images/sponsors/logo.jpg" alt="Logo" class="logo">
                                </div>
                                <div class="cell auto">
                                    <div class="input-group search-container">
                                        <input class="input-group-field" type="text" placeholder="Rechercher">
                                        <div class="input-group-button">
                                            <button type="submit" class="button">
                                                <i class="fa-solid fa-magnifying-glass"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                                
                            <!-- Focused state -->
                            <div class="grid-x align-middle grid-padding-x align-center hide" data-panel="focused-search">
                                <div class="cell auto">
                                    <div class="input-group search-container">
                                        <input class="input-group-field" type="text" placeholder="Rechercher">
                                        <div class="input-group-button">
                                            <button type="submit" class="button">
                                                <i class="fa-solid fa-magnifying-glass"></i>
                                            </button>
                                        </div>
                                        <!-- Search Results Dropdown -->
                                        <div class="
                                        "></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Categories Panel -->
                        <div class="panel categories-panel">
                            <div class="grid-x grid-padding-x grid-padding-y small-up-2 medium-up-4">
                                <!-- Categories will be populated here -->
                            </div>
                        </div>

                        <!-- Sub-categories Panel -->
                        <div class="panel subcategories-panel hide">
                            <div class="grid-y">
                                <!-- Header -->
                                <div class="grid-x align-justify align-middle subcategories-header">
                                    <div class="cell shrink">
                                        <button class="base-button back-to-categories">
                                            <i class="fa-solid fa-arrow-left"></i>
                                        </button>
                                    </div>
                                    <div class="cell shrink">
                                        <button class="base-button select-all-button">Tout sélectionner</button>
                                        <button class="base-button unselect-all-button hide">Tout désélectionner</button>
                                    </div>
                                </div>
                                
                                <!-- List of subcategories -->
                                <div id="subcategories-list">
                                        <!-- Subcategories will be populated here -->
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- Right Column for selected subcategories -->
                    <div class="cell shrink">
                        <!-- Selected Sub-categories Panel -->
                        <div class="panel selected-subcategories-panel hide">
                            <div class="grid-x align-middle grid-padding-x">
                                <div class="cell auto">
                                    <div class="grid-x grid-padding-x grid-padding-y" id="selected-subcategories-list">
                                        <!-- Selected subcategories will be populated here -->
                                    </div>
                                </div>
                            </div>
                            <button class="button alert clear remove-all">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mobile Header -->
        <div class="mobile-header hide-for-medium">
            <div class="grid-x align-middle">
                <div class="cell shrink">
                    <img src="images/sponsors/logo.jpg" alt="Logo" class="logo">
                </div>
                <div class="cell auto">
                    <div class="input-group search-container">
                        <input class="input-group-field" type="text" placeholder="Rechercher">
                        <div class="input-group-button">
                            <button type="submit" class="button">
                                <i class="fa-solid fa-magnifying-glass"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mobile Filter Button -->
        <div class="hide-for-medium">
            <button class="button filter-button" data-toggle="mobile-filter-panel">
                <i class="fa-solid fa-filter"></i>
                <span>Filtres</span>
            </button>
        </div>

        <!-- Mobile Filter Panel -->
        <div class="reveal" id="mobile-filter-panel" data-reveal>
            <!-- Content similar to desktop panels but restructured for mobile -->
        </div>

        <!-- Map Container -->
        <div id="mymap"></div>

        <!-- Foundation and Utilities -->
        <script src="script/jquery.js"></script>
        <script src="script/foundation.min.js"></script>
    </body>
</html>

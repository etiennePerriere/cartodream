<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="content-type" content="text/html; charset=utf-8" />
        <title>Carte interactive</title>
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

        <!--[if lte IE 8]>
            <script>alert("Your web browser does not work well with this application. Please upgrade it or choose another browser.");</script>
        <![endif]-->
        
        <!-- Foundation -->
        <link rel="stylesheet" href="css/foundation.min.css">
        
        <!-- Font Awesome -->
        <link rel="stylesheet" href="css/fontawesome/css/fontawesome.min.css">
        <link rel="stylesheet" href="css/fontawesome/css/brands.min.css" />
        <link rel="stylesheet" href="css/fontawesome/css/solid.min.css" />
        <link rel="stylesheet" href="css/fontawesome/css/regular.min.css" />

        <!-- Leaflet and plugins -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.6.0/dist/leaflet.css" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw-src.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-easybutton@2/src/easy-button.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/naomap/leaflet-fusesearch@1e356c69b2b77e76b8931ded3efe27992ea47a0c/src/leaflet.fusesearch.css">
        
        <!-- Custom CSS -->
         <link rel="stylesheet" href="css/main.css">
        
        <!-- Leaflet Scripts -->
        <script src="https://unpkg.com/leaflet@1.6.0/dist/leaflet-src.js"></script>
        <script src="script/leaflet.markercluster-src.js"></script>
        <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw-src.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/leaflet-easybutton@2/src/easy-button.js"></script>
        
        <!-- Search functionality -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/1.2.2/fuse.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/naomap/leaflet-fusesearch@1e356c69b2b77e76b8931ded3efe27992ea47a0c/src/leaflet.fusesearch.js"></script>

        <!-- Initialize app -->
        <script type="text/javascript" src="js/config/site-config.js"></script>
        <script type="text/javascript" src="js/config/map-config.js"></script>
        <script type="text/javascript" src="js/components/map.js"></script>
        <script type="text/javascript" src="js/components/popups.js"></script>
        <script type="text/javascript" src="js/components/filters.js"></script>
        <script type="text/javascript" src="js/components/search.js"></script>
        <script type="text/javascript" src="js/components/ui.js"></script>
        <script type="text/javascript" src="js/main.js"></script>

        <!-- Data Files -->
        <script type="text/javascript" src="data/fond.js"></script>
        <script type="text/javascript" src="data/POI.js"></script>
        

    </head>

    <body onload="initialize();">
        <header>
            <!-- Title and Sponsors - Desktop -->
            <div class="top-title show-for-medium">
                <div class="grid-x align-middle">
                    <div class="cell medium-3 large-2 text-center">
                        <img src="images/sponsors/bdt.jpg" class="sponsor-logo" alt="Sponsor 1">
                    </div>
                    <div class="cell medium-6 large-8 text-center">
                        <h1 data-js-fill-id="map_title" class="medium-h1"></h1>
                    </div>
                    <div class="cell medium-3 large-2 text-center">
                        <img src="images/sponsors/rb.jpg" class="sponsor-logo" alt="Sponsor 2">
                    </div>
                </div>
            </div>

            <!-- Title and Sponsors - Mobile -->
            <div class="top-title show-for-small-only">
                <div class="grid-y">
                    <div class="cell text-center">
                        <h1 data-js-fill-id="map_title"></h1>
                    </div>
                    <div class="grid-x">
                        <div class="cell small-6 text-center">
                            <img src="images/sponsors/bdt.jpg" class="sponsor-logo" alt="Sponsor 1">
                        </div>
                        <div class="cell small-6 text-center">
                            <img src="images/sponsors/rb.jpg" class="sponsor-logo" alt="Sponsor 2">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filters Section - Desktop -->
            <div class="filters show-for-large">
                <div class="grid-x grid-padding-x">
                    <div class="cell large-4 right-border">
                        <div class="grid-y">
                            <div class="cell text-center">
                                <h2>Porte un dispositif dédié aux</h2>
                            </div>
                            <div class="cell" id="select-list">
                                <!-- Populated by JavaScript -->
                            </div>
                        </div>
                    </div>
                    <div class="cell large-5 right-border">
                        <div class="grid-y">
                            <div class="cell text-center">
                                <h2>Typologie d'acteurs</h2>
                            </div>
                            <div class="cell" id="select-list2">
                                <!-- Populated by JavaScript -->
                            </div>
                        </div>
                    </div>
                    <div class="cell large-3 align-self-middle">
                        <div class="input-group search-container">
                            <input class="input-group-field" type="text" placeholder="Rechercher">
                            <div class="input-group-button">
                                <button type="submit" class="button">
                                    <i class="fa-solid fa-magnifying-glass"></i>
                                </button>
                            </div>
                            <div class="search-results"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filters Section - Mobile - Filter button & research -->
            <div class="mobile-controls hide-for-large">
                <div class="grid-x grid-padding-x align-middle">
                    <div class="cell small-3">
                        <button type="button" class="button filter-button" data-toggle="filter-offcanvas">
                            <i class="fa-solid fa-filter"></i>
                            <span>Filtres</span>
                        </button>
                    </div>
                    <div class="cell small-9">
                        <div class="input-group search-container">
                            <input class="input-group-field" type="text" placeholder="Rechercher">
                            <div class="input-group-button">
                                <button type="submit" class="button">
                                    <i class="fa-solid fa-magnifying-glass"></i>
                                </button>
                            </div>
                            <div class="search-results"></div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main content with mobile filters and map -->
        <div class="off-canvas-wrapper">
            <!-- Filters Section - Mobile - Off canvas menu -->
            <div class="off-canvas-absolute position-left" id="filter-offcanvas" data-off-canvas>
                <div class="grid-y grid-padding-y">
                    <div class="cell">
                        <h3>Porte un dispositif dédié aux</h3>
                        <div id="select-list-mobile">
                            <!-- Populated by JavaScript -->
                        </div>
                    </div>
                    <div class="cell">
                        <h3>Typologie d'acteurs</h3>
                        <div id="select-list2-mobile">
                            <!-- Populated by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main content area -->
            <div class="off-canvas-content" data-off-canvas-content>
                <div id="mymap">
                    <div class="legend-container">
                        <button id="legend-button" class="legend-button">
                            <i class="fa-solid fa-book"></i>
                            <span>Legend</span>
                        </button>
                        <div id="legend-panel" class="legend-panel">
                            <div class="legend-item">
                                <div class="line-icon"></div>
                                <span>Délimitation des EPCI Bretons</span>
                            </div>
                        </div>
                    </div>

                    <button id="help-button" class="help-button" data-open="hints-modal">
                        <i class="fa-solid fa-question"></i>
                        <span>Help</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Hints Modal -->
        <div class="reveal" id="hints-modal" data-reveal>
            <h3 id="hint_title"></h3>
            <div id="hint_content"></div>
            <button class="close-button" data-close aria-label="Close modal" type="button">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>

        <!-- Foundation and Utilities -->
        <script src="script/jquery.js"></script>
        <script src="script/foundation.min.js"></script>
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="content-type" content="text/html; charset=utf-8" />
        <title>Carte interactive</title>
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

        <!--[if lte IE 8]>
            <script>alert("Your web browser does not work well with this application. Please upgrade it or choose another browser.");</script>
        <![endif]-->
        
        <!-- Foundation -->
        <link rel="stylesheet" href="css/foundation.min.css">
        
        <!-- Font Awesome -->
        <link rel="stylesheet" href="css/fontawesome/css/fontawesome.min.css">
        <link href="css/fontawesome/css/brands.min.css" rel="stylesheet" />
        <link href="css/fontawesome/css/solid.min.css" rel="stylesheet" />
        <link href="css/fontawesome/css/regular.min.css" rel="stylesheet" />
        
        <!-- Other CSS -->
        <link rel="stylesheet" href="dist/css/lightbox.min.css">
        <link rel="stylesheet" href="css/normalize.css">
        
        <!-- Leaflet and plugins -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.6.0/dist/leaflet.css" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw-src.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-easybutton@2/src/easy-button.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/naomap/leaflet-fusesearch@1e356c69b2b77e76b8931ded3efe27992ea47a0c/src/leaflet.fusesearch.css">
        
        <!-- Custom CSS -->
         <link rel="stylesheet" href="css/main.css">
        
        <!-- Leaflet Scripts -->
        <script src="https://unpkg.com/leaflet@1.6.0/dist/leaflet-src.js"></script>
        <script src="script/leaflet.markercluster-src.js"></script>
        <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw-src.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/leaflet-easybutton@2/src/easy-button.js"></script>
        <script src="dist/js/lightbox-plus-jquery.min.js"></script>
        
        <!-- Search functionality -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/1.2.2/fuse.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/naomap/leaflet-fusesearch@1e356c69b2b77e76b8931ded3efe27992ea47a0c/src/leaflet.fusesearch.js"></script>

        <!-- Initialize app -->
        <script type="text/javascript" src="js/config/site-config.js"></script>
        <script type="text/javascript" src="js/config/map-config.js"></script>
        <script type="text/javascript" src="js/components/map.js"></script>
        <script type="text/javascript" src="js/components/popups.js"></script>
        <script type="text/javascript" src="js/components/filters.js"></script>
        <script type="text/javascript" src="js/components/search.js"></script>
        <script type="text/javascript" src="js/main.js"></script>

        <!-- Data Files -->
        <script type="text/javascript" src="data/AA.js"></script>
        <script type="text/javascript" src="data/circuits_vtt.js"></script>
        <script type="text/javascript" src="data/AOA.js"></script>
        <script type="text/javascript" src="data/Coeur.js"></script>
        <script type="text/javascript" src="data/communes.js"></script>
        <script type="text/javascript" src="data/POI.js"></script>
        <script type="text/javascript" src="data/batiments.js"></script>
        <script type="text/javascript" src="data/sentiers_PDIPR.js"></script>
        

    </head>

    <body onload="initialize();">
        <header>
            <!-- TITLE AND SPONSORS -->
            <section class="top-title">
                <div class="grid-x align-middle show-for-medium">
                    <div class="cell medium-3 large-2 text-center">
                        <img src="images/sponsors/bdt.jpg" class="sponsor-logo">
                    </div>
                    <div class="cell medium-6 large-8 text-center">
                        <h1 data-js-fill-id="map_title" class="medium-h1"></h1>
                    </div>
                    <div class="cell medium-3 large-2 text-center">
                        <img src="images/sponsors/rb.jpg" class="sponsor-logo">
                    </div>
                </div>

                <div class="grid-x align-middle show-for-small-only">
                    <div class="cell text-center">
                        <h1 data-js-fill-id="map_title"></h1>
                    </div>
                    <div class="cell small-6 text-center">
                        <img src="images/sponsors/bdt_small.jpg" class="sponsor-logo">
                    </div>
                    <div class="cell small-6 text-center">
                        <img src="images/sponsors/rb.jpg" class="sponsor-logo">
                    </div>
                </div>
            </section>

            <!-- FILTERS -->
            <!-- Large screen filters - always visible -->
            <section class="filters show-for-large">
                <div class="grid-x grid-padding-x">
                    <div class="cell large-4 text-center">
                        <div class="grid-x">
                            <div class="cell">
                                Porte un dispositif dédié aux
                            </div>
                        </div>
                        <div id="select-list" class="grid-x">
                            <!-- Populated by JavaScript -->
                        </div>
                    </div>
                    <div class="cell large-4 text-center">
                        <div class="grid-x">
                            <div class="cell">
                                Typologie d'acteurs
                            </div>
                        </div>
                        <div id="select-list2" class="grid-x">
                            <!-- Populated by JavaScript -->
                        </div>
                    </div>
                    <div class="cell large-2">
                        <div class="grid-x">
                            <div class="cell">
                                Délimitation des EPCI Bretons
                            </div>
                            <div class="cell">
                                <i class="fa-regular fa-window-minimize"></i>
                            </div>
                        </div>
                    </div>
                    <div class="cell large-2 text-center">
                        <div class="input-group">
                            <input class="input-group-field" type="text" placeholder="Rechercher">
                            <div class="input-group-button">
                                <button type="submit" class="button">
                                    <i class="fa-solid fa-magnifying-glass"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Small/Medium screen header -->
            <section class="hide-for-large">
                <div class="grid-x grid-padding-x align-middle">
                    <div class="cell small-2">
                        <button type="button" class="button" data-open="filter-offcanvas">
                            <i class="fa-solid fa-filter"></i> Filtres
                        </button>
                    </div>
                    <div class="cell small-10">
                        <div class="input-group">
                            <input class="input-group-field" type="text" placeholder="Rechercher">
                            <div class="input-group-button">
                                <button type="submit" class="button">
                                    <i class="fa-solid fa-magnifying-glass"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </header>

        <!-- Off-canvas filter menu for small/medium screens -->
        <div class="off-canvas position-left" id="filter-offcanvas" data-off-canvas>
            <div class="grid-y grid-padding-y">
                <div class="cell">
                    <h3>Filtres</h3>
                    <button class="close-button" aria-label="Close menu" type="button" data-close>
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="cell">
                    <h4>Porte un dispositif dédié aux</h4>
                    <div id="select-list-mobile" class="grid-y grid-padding-y">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>
                <div class="cell">
                    <h4>Typologie d'acteurs</h4>
                    <div id="select-list2-mobile" class="grid-y grid-padding-y">
                        <!-- Populated by JavaScript -->
                    </div>
                </div>
                <div class="cell">
                    <h4>Délimitation des EPCI Bretons</h4>
                    <i class="fa-regular fa-window-minimize"></i>
                </div>
            </div>
        </div>

        <!-- Main content area -->
        <div class="off-canvas-content" data-off-canvas-content>
            <div id="mymap"></div>
        </div>

        <!-- Tour/Help System -->
        <div id="joyride_tour" class="joyride-list" data-joyride>
            <li data-id="left-panel" data-button="Fermer" data-options="tip_location:right; prev_button:false;">
                <h6 id="hint_title"></h6>
                <p id="hint_content"></p>
            </li>
        </div>

        <!-- Foundation and Utilities -->
        <script src="script/modernizr.js"></script>
        <script src="script/jquery.js"></script>
        <script src="script/what-input.js"></script>
        <script src="script/foundation.min.js"></script>
        <!--script src="script/app-postload.js"></script-->
    </body>
</html>
